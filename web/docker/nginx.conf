server {
    listen 80;
    root /usr/share/nginx/html;
    # redirect relativo: sem isso o nginx manda pra porta 80 de dentro do container
    absolute_redirect off;

    # o build usa base /gamesir-cyclone2-linux/, igual ao GitHub Pages
    location = / {
        return 302 /gamesir-cyclone2-linux/;
    }

    location /gamesir-cyclone2-linux/ {
        try_files $uri $uri/ /gamesir-cyclone2-linux/index.html;
    }
}
